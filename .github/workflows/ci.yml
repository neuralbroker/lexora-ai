name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install black==24.1.1 isort==5.13.2 flake8==7.0.0
      - name: black --check
        run: black --check app tests
      - name: isort --check
        run: isort --check-only app tests
      - name: flake8
        run: flake8 app tests --max-line-length=100 --extend-ignore=E203,E402,W503

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/unit -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build check
        run: docker build -f docker/Dockerfile -t lexora-ai:ci .
